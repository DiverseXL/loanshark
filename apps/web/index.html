<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No inline script and no third-party origin. connect-src is limited to the
      REST host and the EVM JSON-RPC host. frame-ancestors is not set here
      because a meta tag cannot enforce it; it belongs in a response header.
      Vite's development server injects the React refresh preamble as an inline
      script, so this policy is the production one; see ADR-0012.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src https://api-testnet.qore.host https://evm-testnet.qore.host; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>LOANSHARK diagnostics (Diana testnet)</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
